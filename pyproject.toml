# pyproject.toml — Aithera (raíz)
#
# [2026-07-20, S2-extra] Este archivo contenía el pyproject COMPLETO del repo de
# CrewAI (crewai-workspace, autor Joao Moura) — un resto ajeno al proyecto (como
# crew.py y crew_agent_executor.py, también en la raíz). Sus `addopts` de pytest
# (-n, --timeout, --dist, --block-network) exigían plugins no instalados
# (xdist/timeout/socket) y ROMPÍAN `python -m pytest tests/` desde backend/,
# porque pytest sube hasta esta raíz buscando su config.
#
# Se sustituye por la configuración mínima REAL de Aithera. La suite se ejecuta:
#   cd backend && python -m pytest tests/ -v

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--tb=short"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
